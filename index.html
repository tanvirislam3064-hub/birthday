<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "DM Sans", Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   FIRST PAGE
========================= */

.name-page {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,100,190,0.15), transparent 35%),
        linear-gradient(135deg, #18051f, #350b45, #16051f);
    position: relative;
    overflow: hidden;
}

.name-page::before,
.name-page::after {
    content: "♡";
    position: absolute;
    color: rgba(255,255,255,0.08);
    font-size: 180px;
    pointer-events: none;
}

.name-page::before {
    top: -50px;
    left: -40px;
}

.name-page::after {
    bottom: -70px;
    right: -40px;
}

.name-card {
    width: min(430px, 92vw);
    padding: 45px 32px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        inset 0 1px rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.name-card h1 {
    color: white;
    font-size: clamp(28px, 7vw, 42px);
    margin-bottom: 28px;
    font-weight: 700;
}

.name-input {
    width: 100%;
    height: 58px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 17px;
    outline: none;
    padding: 0 20px;
    font-size: 16px;
    text-align: center;
    color: white;
    background: rgba(255,255,255,0.08);
    transition: 0.25s;
}

.name-input::placeholder {
    color: rgba(255,255,255,0.6);
}

.name-input:focus {
    border-color: rgba(255,160,220,0.8);
    box-shadow: 0 0 25px rgba(255,100,200,0.2);
}

.enter-button {
    width: 100%;
    height: 58px;
    margin-top: 18px;
    border: none;
    border-radius: 17px;
    font-size: 16px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #ff65b5, #a84dff);
    box-shadow: 0 12px 30px rgba(210,70,190,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
}

.enter-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 35px rgba(210,70,190,0.45);
}

.enter-button:active {
    transform: scale(0.97);
}

.shake {
    animation: shake 0.45s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
}

/* =========================
   SECOND PAGE
========================= */

.birthday-page {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 18px;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,0.55), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(91,190,255,0.35), transparent 35%),
        linear-gradient(135deg, #73cfff, #a9e4ff, #d8f5ff);
}

/* Soft sky glow */

.bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(20px);
    pointer-events: none;
}

.glow-1 {
    width: 260px;
    height: 260px;
    top: -100px;
    left: -90px;
    background: rgba(255,255,255,0.3);
}

.glow-2 {
    width: 300px;
    height: 300px;
    bottom: -120px;
    right: -100px;
    background: rgba(75,180,255,0.3);
}

/* Floating sparkles */

.floating-sparkles span {
    position: absolute;
    color: rgba(255,255,255,0.8);
    font-size: 25px;
    animation: floatSparkle 5s infinite ease-in-out;
    pointer-events: none;
}

.floating-sparkles span:nth-child(1) {
    top: 10%;
    left: 10%;
}

.floating-sparkles span:nth-child(2) {
    top: 18%;
    right: 13%;
    animation-delay: 1s;
}

.floating-sparkles span:nth-child(3) {
    top: 45%;
    left: 5%;
    animation-delay: 2s;
}

.floating-sparkles span:nth-child(4) {
    bottom: 18%;
    right: 8%;
    animation-delay: 0.5s;
}

.floating-sparkles span:nth-child(5) {
    bottom: 10%;
    left: 17%;
    animation-delay: 1.5s;
}

.floating-sparkles span:nth-child(6) {
    top: 65%;
    right: 18%;
    animation-delay: 2.5s;
}

.floating-sparkles span:nth-child(7) {
    top: 8%;
    left: 50%;
    animation-delay: 3s;
}

@keyframes floatSparkle {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.5;
    }
    50% {
        transform: translateY(-18px) rotate(15deg);
        opacity: 1;
    }
}

/* Main card */

.birthday-content {
    width: min(620px, 94vw);
    padding: 42px 28px 32px;
    text-align: center;
    border-radius: 35px;

    background: rgba(255,255,255,0.32);
    border: 1px solid rgba(255,255,255,0.55);

    box-shadow:
        0 30px 80px rgba(50,130,180,0.25),
        inset 0 1px rgba(255,255,255,0.8);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    position: relative;
    z-index: 2;

    animation: pageAppear 0.9s ease forwards;
}

@keyframes pageAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.birthday-content h1 {
    color: #164b70;
    font-size: clamp(27px, 7vw, 45px);
    line-height: 1.15;
    font-weight: 800;
    margin-bottom: 30px;

    text-shadow:
        0 3px 15px rgba(255,255,255,0.8);
}

.birthday-content h1 span {
    white-space: nowrap;
}

/* Sticker */

.sticker-glow {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}

.sticker-frame {
    width: min(310px, 72vw);
    height: min(310px, 72vw);
    padding: 14px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 35px;

    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.65);

    box-shadow:
        0 15px 45px rgba(43,145,200,0.25),
        0 0 50px rgba(255,255,255,0.4);

    animation: stickerFloat 3.5s ease-in-out infinite;
}

.birthday-sticker {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 25px;
}

@keyframes stickerFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-9px) rotate(1deg);
    }
}

/* Messages */

.wish-container {
    color: #164b70;
}

.birthday-wish {
    font-size: clamp(21px, 5vw, 29px);
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 13px;
}

.birthday-note {
    font-size: clamp(15px, 4vw, 19px);
    font-weight: 500;
    line-height: 1.5;
    color: #286589;
}

.bottom-hearts {
    margin-top: 28px;
    font-size: 22px;
    color: #277ba6;
    letter-spacing: 5px;
}

/* Mobile */

@media (max-width: 500px) {

    .name-card {
        padding: 38px 22px;
    }

    .birthday-content {
        padding: 32px 18px 27px;
        border-radius: 28px;
    }

    .birthday-content h1 {
        margin-bottom: 25px;
    }

    .sticker-frame {
        border-radius: 28px;
    }

    .birthday-wish {
        font-size: 20px;
    }

    .birthday-note {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<!-- =========================
     FIRST PAGE
========================= -->

<div class="name-page" id="namePage">

    <div class="name-card" id="nameCard">

        <h1>Enter Your Name</h1>

        <input
            type="text"
            id="nameInput"
            class="name-input"
            placeholder="Enter Your Name"
            autocomplete="off"
        >

        <button
            class="enter-button"
            id="enterButton"
        >
            Enter Your Name
        </button>

    </div>

</div>

<script>

const nameInput = document.getElementById("nameInput");
const enterButton = document.getElementById("enterButton");
const nameCard = document.getElementById("nameCard");

function enterBirthday() {

    const name = nameInput.value.trim();

    /* Only Nisa can enter */

    if (name.toLowerCase() !== "nisa") {

        nameCard.classList.remove("shake");

        void nameCard.offsetWidth;

        nameCard.classList.add("shake");

        nameInput.value = "";

        return;
    }

    showBirthdayPage();
}

enterButton.addEventListener("click", enterBirthday);

nameInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        enterBirthday();
    }

});


function showBirthdayPage() {

    document.body.innerHTML = `

        <div class="birthday-page">

            <div class="bg-glow glow-1"></div>
            <div class="bg-glow glow-2"></div>

            <div class="floating-sparkles">

                <span>✦</span>
                <span>✧</span>
                <span>♡</span>
                <span>✦</span>
                <span>⋆</span>
                <span>♡</span>
                <span>✧</span>

            </div>


            <div class="birthday-content">

                <h1>
                    Happy Birthdayy Twinnn 😋
                    <span>🥳🥳✨</span>
                </h1>


                <div class="sticker-glow">

                    <div class="sticker-frame">

                        <img
                            src="803101274_18381004612233641_8598501174380342559_n.png"
                            class="birthday-sticker"
                            alt="Birthday sticker"
                        >

                    </div>

                </div>


                <div class="wish-container">

                    <p class="birthday-wish">
                        Wish youu the bestt in life and Good luck speacially  on your exams 😭
                    </p>

                    <p class="birthday-note">
                        I was lowkey studying in night so a little bit late lol 😭🫂
                    </p>

                </div>


                <div class="bottom-hearts">
                    ♡ &nbsp; ✦ &nbsp; ♡ &nbsp; ✦ &nbsp; ♡
                </div>

            </div>

        </div>

    `;
}

</script>

</body>
</html>
